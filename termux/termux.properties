# ==============================================================================
# Termux Configuration (~/.termux/termux.properties)
#
# Changes can be reloaded without restarting the app by running:
#   termux-reload-settings
#
# Font & Font Size:
#   The terminal font is symlinked to ~/.termux/font.ttf (Iosevka Term).
#   Font size in Termux is controlled via screen pinch-to-zoom gestures
#   or hardware keyboard shortcuts (Ctrl+Alt+= to increase, Ctrl+Alt+- to decrease).
# ==============================================================================

# Disable the extra keys toolbar / command row below the terminal
extra-keys = []

# Terminal behavior & display
bell-character = ignore
use-black-ui = true
hide-soft-keyboard-on-startup = true
terminal-transcript-rows = 10000
allow-external-apps = true

# Hardware keyboard shortcuts
shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1
shortcut.rename-session = alt + ctrl + n

# Fullscreen & layout adjustments
fullscreen = false
use-fullscreen-workaround = true
