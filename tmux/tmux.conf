# WCX's TMUX Config

# ----- Terminal identity and colour
#
# What a pane is, stated explicitly rather than left to tmux-sensible, which
# only upgrades it when it is still the bare "screen".  Guarded, because tmux
# refuses to start at all when default-terminal names an entry the box has no
# terminfo for, and this file is shared with older Arch/Ubuntu machines whose
# ncurses may predate tmux-256color.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# What the *outer* terminal can do. tmux reads the client's TERM to decide, so
# this only works now that nothing exports TERM from ~/.zshrc -- with that
# export in place the client announced itself as xterm-256color, tmux concluded
# 256 colours, and truecolor was lost inside tmux even though Ghostty had it.
# Declared only for the entry that really carries Tc/setrgbf; the
# xterm-256color fallback relies on COLORTERM=truecolor, which tmux also reads,
# rather than on a claim its terminfo does not back up.
set -as terminal-features ",xterm-ghostty:RGB"

# Let an application inside a pane put text on the *outer* terminal's
# clipboard with OSC 52. The default here was "external", which lets tmux do
# it from copy-mode but makes it ignore the sequence coming from Emacs -- so a
# kill in a remote Emacs never reached the clipboard of the machine being
# typed on. Emacs's side is xterm-tmux-extra-capabilities in wcx-tty.el.
set -g set-clipboard on

# Truecolor for programs inside a pane, regardless of what the ssh client set.
#
# Emacs enables 24-bit colour when terminfo carries Tc/RGB *or* when
# COLORTERM=truecolor (src/term.c, "Fall back to xterm+direct ... or if
# requested by the COLORTERM environment variable"). Ghostty exports it, so this
# already worked locally -- but ssh does not forward COLORTERM, so connecting
# from a tablet client dropped Emacs to 256 colours.
#
# Setting it in tmux's own environment is the honest place for it: it describes
# what *tmux* accepts from the programs it hosts, not what the far client can
# display. tmux renders down to the client's real capability, which is what
# terminal-features above declares. So this is not the old TERM lie in another
# costume -- nothing downstream is being told it has colour it lacks.
set-environment -g COLORTERM truecolor

# ----- Modified keys
#
# Let a program in a pane ask for modifyOtherKeys, so C-<arrow>, S-RET, C-, and
# friends can reach it as distinct keys instead of being flattened into the
# handful of sequences a plain terminal can express. Emacs asks for this by
# itself under tmux: lisp/term/tmux.el pins xterm-tmux-extra-capabilities to
# (modifyOtherKeys) and sends CSI >4;1m, deliberately without the capability
# query that behaves badly through tmux (bug#20356).
#
# Safe to switch on regardless of what the client at the far end can do. Per
# tmux(1), this option only governs what the program *inside* the pane may
# request; whether tmux asks the outer terminal is decided separately by the
# extkeys terminal feature, which is not declared here.
set -s extended-keys on

# The xterm format (^[[27;6;65~) rather than csi-u (^[[65;6u), because
# modifyOtherKeys is what Emacs negotiates. It is also tmux's default, stated
# explicitly so a future change of default cannot quietly break key decoding.
set -s extended-keys-format xterm

# Declaring the *client* capable of extended keys is the other half, and is
# deliberately absent:
#
#   set -as terminal-features ",<client-TERM>:extkeys"
#
# It would make tmux negotiate with the terminal at the far end, which on an
# unknown client can mean the negotiation sequence being printed as literal
# text. Add it only for a TERM measured to handle it.

# Pinned rather than left to tmux-sensible, which sets 0 only when it finds the
# old 500 default -- so the effective value differs between machines running this
# same config. 10ms is what this machine already had.
#
# It is the window tmux waits after an ESC before deciding it was a lone key
# rather than the start of a sequence. Low keeps ESC snappy, which evil-mode
# wants; too low can split an arrow key's own escape sequence across a
# high-latency link and deliver it as M-[ plus a letter. Raise it toward 50-100
# if arrows misbehave from a cellular connection.
set -s escape-time 10

# Change the binding for the control key to screen's
unbind C-b
set-option -g prefix C-t
bind-key t send-keys C-t
bind-key C-t last-window

# Status bar stuff
#set-option -g status-utf8 on

# Set window notifications
setw -g monitor-activity on
set -g visual-activity off

# Default first session to 'main', while subsequent sessions follow tmux defaults (1, 2, ...)
set-hook -g session-created 'if -F "#{==:#{session_name},0}" "rename-session main"'

# setup tpm (https://github.com/tmux-plugins/tpm)

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'christoomey/vim-tmux-navigator'

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Reload conf
bind-key r source-file ~/.tmux.conf

# ----- Theme & Statusline: Catppuccin Mocha
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag, 🔍,}'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_status_fill 'icon'
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_directory_text ' #{b:pane_current_path}'

# Status module icons (defaults to Nerd Font icons; if running on a terminal without Nerd Font,
# representative Unicode characters e.g. 📁 / 💻 / ⚡ can be configured as drop-in fallbacks)
set -ogq @catppuccin_directory_icon " "
set -ogq @catppuccin_host_icon "󰒋 "
set -ogq @catppuccin_session_icon " "

# Status bar options & native zero-overhead indicators
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{?client_prefix,#[fg=#{@thm_bg} bg=#{@thm_yellow} bold] ⌨  PREFIX #[default] ,}"
# Right status: Directory, Host, and Session badges
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_host}#{E:@catppuccin_status_session}"

# ----- Plugin Configurations

# Session Persistence (tmux-resurrect & tmux-continuum)
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Fast Hint Copying (tmux-thumbs)
set -g @thumbs-key F
set -g @thumbs-osc52 1
set -g @thumbs-command 'tmux set-buffer -- "{}"'
set -g @thumbs-upcase-command 'tmux set-buffer -- "{}" && tmux paste-buffer'

# Fuzzy Switcher & URL Picker (tmux-fzf & tmux-fzf-url)
set -g @fzf-url-bind 'u'
set -g @fzf-url-history-limit '2000'
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_OPTIONS="-p -w 65% -h 50% -m"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Post-plugin overrides: ensure command/message prompt has a solid background and left alignment
set -gF message-style "fg=#{@thm_fg},bg=#{@thm_mantle},align=left"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_mantle},align=left"
