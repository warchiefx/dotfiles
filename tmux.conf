# WCX's TMUX Config

# ----- Terminal identity and colour
#
# What a pane is, stated explicitly rather than left to tmux-sensible, which
# only upgrades it when it is still the bare "screen".  Guarded, because tmux
# refuses to start at all when default-terminal names an entry the box has no
# terminfo for, and this file is shared with older Arch/Ubuntu machines whose
# ncurses may predate tmux-256color.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# What the *outer* terminal can do. tmux reads the client's TERM to decide, so
# this only works now that nothing exports TERM from ~/.zshrc -- with that
# export in place the client announced itself as xterm-256color, tmux concluded
# 256 colours, and truecolor was lost inside tmux even though Ghostty had it.
# Declared only for the entry that really carries Tc/setrgbf; the
# xterm-256color fallback relies on COLORTERM=truecolor, which tmux also reads,
# rather than on a claim its terminfo does not back up.
set -as terminal-features ",xterm-ghostty:RGB"

# Let an application inside a pane put text on the *outer* terminal's
# clipboard with OSC 52. The default here was "external", which lets tmux do
# it from copy-mode but makes it ignore the sequence coming from Emacs -- so a
# kill in a remote Emacs never reached the clipboard of the machine being
# typed on. Emacs's side is xterm-tmux-extra-capabilities in wcx-tty.el.
set -g set-clipboard on

# Change the binding for the control key to screen's
unbind C-b
set-option -g prefix C-t
bind-key t send-keys C-t
bind-key C-t last-window

# Status bar stuff
#set-option -g status-utf8 on

# Set window notifications
setw -g monitor-activity on
set -g visual-activity off

# setup tpm (https://github.com/tmux-plugins/tpm)

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'dracula/tmux'

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Setup theme
# set -g @themepack 'powerline/default/green'
# Status
# set-option -g pane-active-border-fg black
# set-option -g pane-active-border-bg default
# set-option -g pane-border-fg black
# set-option -g pane-border-bg default
set -g status-left ''
set -g status-right '#[fg=black,bold]#(echo $USER)@#H #[fg=black]'
set -g status-right-length 100
set -g status-bg default

# Reload conf
bind-key r source-file ~/.tmux.conf

# Window status
set-option -g status-position bottom
setw -g window-status-format '#[fg=black,bold,bg=white] #I #[fg=white,bold,bg=black,bold] #W '
setw -g window-status-current-format '#[fg=black,bg=yellow] #I #[fg=white,bg=black,bold] #W '

# Some theme tweaks
set -g clock-mode-style 12
set -g @dracula-battery-label false
set -g @dracula-no-battery-label false
set -g @dracula-show-battery-status false
set -g @dracula-show-left-icon hostname
set -g @dracula-show-empty-plugins false
set -g @dracula-show-location false
set -g @dracula-show-fahrenheit false
set -g @dracula-plugins "git"
# for left
set -g @dracula-show-left-sep 

# for right symbol (can set any symbol you like as separator)
set -g @dracula-show-right-sep 

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
